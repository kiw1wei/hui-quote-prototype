function drawDialog(){let title='',body='';if(dialog==='reviewnotes'){title='交互演示';body='示例数据';}else if(dialog==='report'){const j=selectedJob();title='变更总览';body=`<dl><dt>提交时间</dt><dd>${j.created}</dd><dt>发起人</dt><dd>—</dd><dt>变更版本</dt><dd>${j.id}　${j.pendingVersion||'—'}</dd><dt>审批状态</dt><dd>${j.status==='审核中'?'待审批':auditState(j)}</dd></dl>${['资金下发','国际收款','会富卡','国际收单'].map(group=>{const rows=changed(j.draft,j.before).filter(r=>groups[r.g][0]===group);return '<h3>'+group+'　'+rows.length+' 项</h3>'+(rows.length?comparison(j.draft,rows):'')}).join('')}<div class="actions">${b('关闭','close')}</div>`}else if(dialog==='confirm'){title='确认报价单并生效';const j=s.job;body=`<p class="sub">确认后报价单将锁定，并自动切换费率。</p><dl><dt>报价单号</dt><dd>${j.id}</dd><dt>确认范围</dt><dd>${groups.map((g,i)=>count(i,j.draft,j.before)?g[1]+' '+count(i,j.draft,j.before)+' 项':'').filter(Boolean).join(' + ')}</dd></dl><div class="caution">确认后不可撤销。如需调整，需基于本版本发起新的变更单，并重新走确认流程。</div><label class="agreement"><input type="checkbox" id="agreement"> 我已核对全部收费项，并同意当前报价</label><div class="actions">${b('取消','close')}${b('确认并生效','activate','pri',true)}</div>`}else if(dialog==='approve'){title='审核通过此申请？';body=`<p>通过后通知客户确认。客户确认前，当前报价继续有效。</p><div class="actions">${b('取消','close')}${b('确认通过','pass','pri')}</div>`}else if(dialog==='reject'||dialog==='external-reject'){title='驳回调价申请';body=`<p><label for="q-reason">驳回原因（必填）</label></p><textarea id="q-reason" placeholder="请说明需要修改的内容"></textarea><div id="q-error" class="error" role="alert"></div><div class="actions">${b('取消','close')}${b('确认驳回','reject-send','pri')}</div>`}else if(dialog==='cancel'||dialog==='reset'){title=dialog==='cancel'?'放弃本次未提交的修改？':'重置当前产品的新报价？';body=`<p>已填写的新报价将被清空，当前生效报价不受影响。</p><div class="actions">${b('继续编辑','close')}${b('确认','discard','pri')}</div>`}else if(dialog==='file'){title='审批材料';const f=selectedJob().files[s.file||0];body=`<p>${esc(f.name)}</p>${/\.(jpe?g|png)$/i.test(f.name)?`<img alt="审批材料" style="max-width:100%;max-height:45vh;object-fit:contain" src="${f.url}">`:''}<div class="actions">${b('关闭','close')}<a download="${esc(f.name)}" href="${f.url}">下载材料</a></div>`}else{title='报价单预览';const snap=s.page==='C04'?(s.old[s.hist||0]||{rows:base,version:'V2026.10.01.100000'}):{rows:s.current,version:s.version};body=`<p>客户</p><p class="sub break">${snap.version}</p><p>${groups[s.g][1]}</p>${simpleTable(snap.rows.filter(r=>r.g===s.g))}<p class="sub">正式 PDF 使用完整报价模板；此处预览当前业务样例。</p><div class="actions">${b('关闭','close')}</div>`}
root.querySelector('#q-modal').innerHTML=`<div class="modalback"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}"><h2>${title}</h2>${body}</section></div>`;root.querySelector('.dialog button')?.focus()}
function updateDraft(t){const id=+t.dataset.id,k=t.dataset.key;if(!t.checkValidity()){t.reportValidity();return false}s.draft[id]??={};s.draft[id][k]=t.value;return true}
root.addEventListener('input',e=>{const t=e.target;if(t.dataset.id!=null&&updateDraft(t)){const r=s.current[+t.dataset.id];root.querySelector(`[data-diff="${r.id}"]`).innerHTML=diff(r,val(r,s.draft[r.id]));const total=root.querySelector('#q-total');if(total)total.textContent=changed().length;root.querySelectorAll('.productnav [data-go]').forEach((el)=>{const i=+el.dataset.go.split(':')[1],n=count(i);el.innerHTML=groups[i][1]+' <small>'+(n||'无变动')+'</small>'});save()}});
root.addEventListener('change',e=>{const t=e.target;if(t.dataset.field==='chooseAll'){s.chosen=t.checked?s.current.filter(r=>r.g===s.g&&!r.unconfigured&&(s.filter==='all'||r.type===s.filter)).map(r=>r.id):[];render();save();return}if(t.dataset.batchkey){s.batchKeys??=[];s.batchKeys=t.checked?[...new Set([...s.batchKeys,t.dataset.batchkey])]:s.batchKeys.filter(k=>k!==t.dataset.batchkey);render();return}if(t.id==='agreement'){root.querySelector('[data-go=activate]').disabled=!t.checked;return}if(t.dataset.id!=null){updateDraft(t)}else if(t.dataset.choose!=null){const id=+t.dataset.choose;s.chosen=t.checked?[...new Set([...s.chosen,id])]:s.chosen.filter(x=>x!==id);render()}else if(t.dataset.field){const f=t.dataset.field;s[f]=t.type==='checkbox'?t.checked:t.value;s.tablePage=0;if(f==='platform'){const second=r=>/Vinted|Vestiaire|Poshmark/.test(r.name);s.chosen=t.value?s.current.filter(r=>r.g===0&&!r.unconfigured&&(t.value==='全选所有平台'||(t.value==='全选二手平台'?second(r):!second(r)))).map(r=>r.id):[]}render()}save()});
root.addEventListener('click',async e=>{const el=e.target.closest('[data-go]');if(!el||el.disabled)return;const [a,arg]=el.dataset.go.split(':');error='';flash='';
if(a==='client-reset'){root.querySelectorAll('[data-customer-filter]').forEach(e=>e.value='');return}else if(a==='client-query'){const filled=[...root.querySelectorAll('[data-customer-filter]')].some(e=>e.value.trim());s.customerEmpty=filled;root.querySelector('tbody').hidden=filled;return}else if(a==='viewreport'){s.inspect=arg;dialog='report'}else if(a==='reviewnotes'){dialog='reviewnotes'}else if(a==='demoaudit'){if(!active()){seedJob('HKPOSS');s.job.status='审核中';s.job.approved='';s.job.files=[{name:'审批材料示例.html',url:'data:text/html;charset=utf-8,'+encodeURIComponent('<h1>原型示例审批材料</h1><p>本文件用于展示材料下载交互。</p>')}]}s.inspect=s.job.id;s.page=s.job.channel==='HKPOSS'?'O06':'S05'}else if(a==='report'){dialog='report'}else if(a==='pg'){s.tablePage=+arg}else if(a==='sample'&&!s.job){seedJob();s.g=0;s.page='C01'}else if(a==='contract'){s.contractTab=+arg;s.tablePage=0}else if(a==='notice'){e.preventDefault();const j=jobs().find(x=>x.id===arg);if(!j)return;if(j===s.job&&j.status==='待客户确认'){s.g=changed(j.draft,j.before)[0].g;s.page='C05'}else {s.inspect=j.id;s.page='C08'}}
else if(a==='ticket'){const target=jobs().find(j=>j.id===arg);if(target===s.job&&target?.status==='已驳回'){s.draft=structuredClone(target.draft);s.page=target.channel==='HKPOSS'?'O03':'S03';s.g=0;render();save();return}s.inspect=arg;s.fromAudit=s.page==='O06';s.page=s.page[0]==='S'?'S06':'O08';s.g=0;s.tablePage=0}
else if(a==='audit'){s.inspect=arg;s.page='O06';s.g=0}
else if(a==='scene')startScene(arg);else if(a==='home'){s.page='home';dialog=''}else if(a==='notes')s.notes=!s.notes;
else if(a==='jump'){if(arg[0]==='C'){startScene('customer');if(arg==='C06'){activate();}else if(arg==='C04'){s.old=[{version:'V2026.10.01.100000',date:'2026-10-01 10:00:00',rows:structuredClone(base)}]}}else if(arg[0]==='S'){startScene('sales');if(['S04','S05'].includes(arg))s.draft={0:{rate:.5}};if(arg==='S05')createJob('钉钉宜搭',[])}else if(arg[0]==='O'){startScene('ops');if(['O04','O05','O06','O07'].includes(arg))s.draft={0:{rate:.5}};if(['O05','O06','O07'].includes(arg))createJob('HKPOSS',['线下审批截图.png'])}s.page=arg;}
else if(pages[a]){s.page=a;s.tablePage=0;s.g=0;s.filter='all';s.only=false}
else if(a==='g'){s.g=+arg;s.batchKeys=[];s.chosen=[];s.platform='';s.tablePage=0;s.payMode='卡支付'}
else if(a==='hist'){s.hist=+arg;s.page='C04';s.g=0}
else if(a==='begin'){if(active())return;s.draft={};s.chosen=[];s.g=0;s.page=arg==='sales'?'S03':'O03'}
else if(a==='next'){const invalid=[...root.querySelectorAll('input[type=number]')].find(t=>!t.checkValidity());if(invalid){invalid.reportValidity();return}if(!changed().length)error='请至少修改一个计费项后再继续。';else s.page=s.page==='S03'?'S04':'O04'}
else if(a==='pdf'){window.print();return}else if(['confirm','approve','reject','external-reject','cancel','reset'].includes(a))dialog=a;
else if(a==='close')dialog='';
else if(a==='discard'){const exit=dialog==='cancel';if(exit)s.draft={};else s.current.filter(r=>r.g===s.g).forEach(r=>delete s.draft[r.id]);s.chosen=[];dialog='';if(exit)s.page=s.page==='S03'?'S05':'O07'}
else if(a==='batch'){const r=root.querySelector('#q-batch-rate'),m=root.querySelector('#q-batch-amount');const min=root.querySelector('#q-batch-min');const invalid=[r,m,min].filter(Boolean).find(e=>!e.checkValidity());if(invalid){invalid.reportValidity();return}s.chosen.forEach(id=>{const item=s.current[id];if(item.unconfigured)return;s.draft[id]??={};if(r&&r.value!==''&&item.type!=='fixed')s.draft[id].rate=r.value;if(m&&m.value!==''&&['both','fixed'].includes(item.type))s.draft[id].amount=m.value;if(min&&min.value!==''&&item.type==='max')s.draft[id].amount=min.value})}
else if(a==='send'){if(active())return;const op=s.page==='O04',files=op?[...root.querySelector('#q-files').files].map(f=>f.name):[];if(op&&!files.length){root.querySelector('#q-error').textContent='请至少提供一份审批材料。';return}if(files.some(f=>!(/\.(pdf|jpe?g|png|html)$/i).test(f))){root.querySelector('#q-error').textContent='材料格式不支持，请选择 PDF、JPG、PNG、JPEG 或 HTML。';return}el.disabled=true;let attachments=[];try{if(op)attachments=await Promise.all([...root.querySelector('#q-files').files].map(f=>new Promise((ok,fail)=>{const r=new FileReader();r.onload=()=>ok({name:f.name,url:r.result});r.onerror=fail;r.readAsDataURL(f)})))}catch{el.disabled=false;root.querySelector('#q-error').textContent='材料未能读取，请重新选择。';return}createJob(op?'HKPOSS':'钉钉宜搭',attachments);s.page=op?'O07':'S05';flash='调价已提交，当前报价尚未改变。'}
else if(a==='pass'||a==='external-pass'){if(s.job?.status==='审核中'){s.job.status='待客户确认';s.job.approved=now();s.job.pendingVersion||=version();dialog='';flash='审批已通过，等待客户在 Hui+ 确认新报价。'}}
else if(a==='reject-send'){const reason=root.querySelector('#q-reason').value.trim();if(!reason){root.querySelector('#q-error').textContent='请填写驳回原因。';return}s.job.status='已驳回';s.job.rejected=now();s.job.reason=reason;dialog='';flash='申请已驳回，当前报价不变。'}
else if(a==='retry'){if(active())return;s.draft=structuredClone(s.job.draft);s.page=s.job.channel==='HKPOSS'?'O03':'S03'}
else if(a==='activate'){if(root.querySelector('#agreement')?.checked)activate()}
else if(a==='file'){s.file=+arg;dialog='file'}
render();save();});
function createJob(channel,files){if(s.job)s.archived.unshift({...s.job,status:s.job.status});const draft={};changed().forEach(r=>draft[r.id]={...s.draft[r.id]});s.job={id:'HQ'+now().slice(0,10).replaceAll('-','')+String(++s.serial).padStart(4,'0'),status:'审核中',channel,files,draft,before:structuredClone(s.current),created:now(),approved:'',reason:'',pendingVersion:version()};s.draft={};s.chosen=[]}
function activate(){if(s.job?.status!=='待客户确认')return;s.old.unshift({version:s.version,date:s.date,rows:structuredClone(s.current)});s.current=s.current.map(r=>val(r,s.job.draft[r.id]));s.version=s.job.pendingVersion||version();s.date=now();s.archived.forEach(j=>{if(j.status==='已生效')j.status='已过期'});s.job.status='已生效';s.job.confirmed=s.date;s.job.effectiveVersion=s.version;s.page='C06';dialog=''}
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog='';render()}if(e.key==='Tab'&&dialog){const nodes=[...root.querySelectorAll('.dialog button,.dialog input,.dialog textarea')];if(!nodes.length)return;const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
})();
